# Render Blueprint: one Docker web service in Singapore serving the API and the web app (ADR-026).
services:
  - type: web
    name: crewline
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Neon direct connection string (not the -pooler host; LISTEN needs a direct session). Entered in the dashboard.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Passed to the Docker build as a build argument; must match the service URL Render assigns.
      - key: CREWLINE_PUBLIC_URL
        value: https://crewline-20bm.onrender.com
      # Cloudflare in front of Render overwrites this header with the real client IP; X-Forwarded-For is spoofable (B-33).
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: LAB_ENABLED
        value: "true"
